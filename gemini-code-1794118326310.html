<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AR 1. Thai Game - แยกชนิดของคำ</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Mali:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Mali', cursive;
            background: linear-gradient(135deg, #a8edea 0%, #fed6e3 100%);
            min-height: 100vh;
        }
        .glass-panel {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 2px solid rgba(255, 255, 255, 0.5);
        }
        .word-card {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .word-card:hover {
            transform: translateY(-2px);
        }
        .word-card.selected {
            transform: scale(1.1) translateY(-5px);
            box-shadow: 0 10px 25px rgba(59, 130, 246, 0.5);
            border-color: #3b82f6;
            background-color: #eff6ff;
            z-index: 10;
        }
        .category-box {
            transition: all 0.3s ease;
        }
        .category-box:hover {
            transform: scale(1.02);
        }
    </style>
</head>
<body class="p-4 md:p-8 flex flex-col items-center">

    <div class="max-w-5xl w-full glass-panel rounded-3xl shadow-2xl p-8 border-4 border-white/80">
        <h1 class="text-4xl md:text-5xl text-center font-bold text-pink-600 mb-3 drop-shadow-sm">✨ เกมแยกชนิดของคำภาษาไทย ✨</h1>
        <p class="text-center text-lg text-gray-700 mb-8 font-semibold bg-white/50 py-2 rounded-full max-w-2xl mx-auto">
            👆 คลิกเลือก "บัตรคำ" ด้านบน แล้วนำมาใส่ใน "กล่องหมวดหมู่" ด้านล่างให้ถูกต้องนะ!
        </p>

        <!-- Word Bank (Source) -->
        <div id="word-bank" class="flex flex-wrap justify-center gap-3 mb-10 min-h-[120px] p-6 bg-white/60 rounded-2xl border-4 border-dashed border-pink-300 shadow-inner">
            <!-- Words will be generated here by JS -->
        </div>

        <!-- Categories -->
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6 mb-10">
            <!-- Noun -->
            <div class="category-box glass-panel border-4 border-blue-300 rounded-2xl p-5 cursor-pointer hover:bg-blue-50/80" data-type="noun">
                <h2 class="text-2xl font-bold text-center text-blue-700 mb-4 border-b-4 border-blue-200 pb-2">คำนาม<br><span class="text-base font-normal text-blue-600">(คน, สัตว์, สิ่งของ, สถานที่)</span></h2>
                <div class="word-container flex flex-wrap justify-center gap-2 min-h-[100px]"></div>
            </div>
            
            <!-- Pronoun -->
            <div class="category-box glass-panel border-4 border-purple-300 rounded-2xl p-5 cursor-pointer hover:bg-purple-50/80" data-type="pronoun">
                <h2 class="text-2xl font-bold text-center text-purple-700 mb-4 border-b-4 border-purple-200 pb-2">คำสรรพนาม<br><span class="text-base font-normal text-purple-600">(คำใช้เรียกแทนชื่อ)</span></h2>
                <div class="word-container flex flex-wrap justify-center gap-2 min-h-[100px]"></div>
            </div>

            <!-- Verb -->
            <div class="category-box glass-panel border-4 border-red-300 rounded-2xl p-5 cursor-pointer hover:bg-red-50/80" data-type="verb">
                <h2 class="text-2xl font-bold text-center text-red-700 mb-4 border-b-4 border-red-200 pb-2">คำกริยา<br><span class="text-base font-normal text-red-600">(การกระทำ, อาการ)</span></h2>
                <div class="word-container flex flex-wrap justify-center gap-2 min-h-[100px]"></div>
            </div>

            <!-- Adjective -->
            <div class="category-box glass-panel border-4 border-orange-300 rounded-2xl p-5 cursor-pointer hover:bg-orange-50/80" data-type="adj">
                <h2 class="text-2xl font-bold text-center text-orange-700 mb-4 border-b-4 border-orange-200 pb-2">คำวิเศษณ์<br><span class="text-base font-normal text-orange-600">(คำขยาย บอกลักษณะ)</span></h2>
                <div class="word-container flex flex-wrap justify-center gap-2 min-h-[100px]"></div>
            </div>
        </div>

        <!-- Controls -->
        <div class="flex flex-col sm:flex-row justify-center items-center gap-6">
            <button id="check-btn" class="bg-gradient-to-r from-green-400 to-green-500 hover:from-green-500 hover:to-green-600 text-white font-bold py-4 px-10 rounded-full shadow-xl transform hover:scale-105 transition-all text-2xl border-4 border-white">
                ✅ ตรวจคำตอบ
            </button>
            <button id="reset-btn" class="bg-white hover:bg-gray-100 text-gray-700 font-bold py-4 px-10 rounded-full shadow-lg transform hover:scale-105 transition-all text-2xl border-4 border-gray-200">
                🔄 เริ่มใหม่
            </button>
        </div>

        <!-- Result -->
        <div id="result-message" class="text-center text-3xl font-bold mt-8 hidden bg-white/80 py-4 px-8 rounded-full shadow-md max-w-lg mx-auto"></div>
    </div>

    <script>
        // Vocabulary derived from the provided PDF
        const vocabulary = [
            { word: "โรงเรียน", type: "noun" }, //[cite: 1]
            { word: "คุณครู", type: "noun" }, //[cite: 1]
            { word: "ทะเล", type: "noun" }, //[cite: 9]
            { word: "สมุด", type: "noun" }, //[cite: 1]
            { word: "ต้นไม้", type: "noun" }, //[cite: 10]
            
            { word: "ฉัน", type: "pronoun" }, //[cite: 2]
            { word: "เธอ", type: "pronoun" }, //[cite: 2]
            { word: "เขา", type: "pronoun" }, //[cite: 2]
            { word: "พวกเรา", type: "pronoun" }, //[cite: 2]
            { word: "ท่าน", type: "pronoun" }, //[cite: 3]
            
            { word: "กิน", type: "verb" }, //[cite: 3]
            { word: "เดิน", type: "verb" }, //[cite: 3]
            { word: "กระโดด", type: "verb" }, //[cite: 4]
            { word: "ร้องเพลง", type: "verb" }, //[cite: 4]
            { word: "นอน", type: "verb" }, //[cite: 3]
            
            { word: "สวย", type: "adj" }, //[cite: 4]
            { word: "หล่อ", type: "adj" }, //[cite: 4]
            { word: "น่ารัก", type: "adj" }, //[cite: 5]
            { word: "สูง", type: "adj" }, //[cite: 5]
            { word: "อ้วน", type: "adj" } //[cite: 5]
        ];

        let selectedWordElement = null;

        function shuffle(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        function initGame() {
            const wordBank = document.getElementById('word-bank');
            wordBank.innerHTML = '';
            
            document.querySelectorAll('.category-box .word-container').forEach(container => {
                container.innerHTML = '';
            });

            document.getElementById('result-message').classList.add('hidden');
            selectedWordElement = null;

            const shuffledVocab = shuffle([...vocabulary]);
            
            shuffledVocab.forEach(item => {
                const wordEl = document.createElement('div');
                wordEl.textContent = item.word;
                wordEl.dataset.type = item.type;
                wordEl.className = 'word-card bg-white border-4 border-pink-200 text-pink-700 rounded-xl px-5 py-2 text-xl font-bold cursor-pointer shadow-md select-none';
                
                wordEl.addEventListener('click', handleWordClick);
                wordBank.appendChild(wordEl);
            });
        }

        function handleWordClick(e) {
            const word
